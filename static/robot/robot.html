    <script name="create_sliders">
      document.addEventListener("DOMContentLoaded", function () {
        const slidersContainer = document.getElementById("joint-sliders");

        let slidersHTML = "";
        joints.forEach((joint) => {
            slidersHTML += `
                <div class="form-group">
                    <label for="${joint.name}-slider">${joint.label}: <span id="${joint.name}-value">${joint.value}</span></label>
                    <input type="range" class="form-control-range" id="${joint.name}-slider" 
                           name="${joint.name}" min="${joint.min}" max="${joint.max}" value="${joint.value}" step="1">
                </div>
            `;
        });

        slidersContainer.innerHTML = slidersHTML;
      });
    </script>
    <script name="handle_sliders">
      document.addEventListener("DOMContentLoaded", function () {

        function update_joint_angle(jointName, degrees) {
          if (xrobot && xrobot.joint && xrobot.joint[jointName]) {
            const joint = xrobot.joint[jointName];
            let actualDegrees = degrees;
            const invertedJoints = [
              "right_shoulder_y",
              "right_shoulder_x",
              "right_elbow_y",
              "left_shoulder_z",
              "left_shoulder_y",
              "left_elbow_y",
            ];
            if (invertedJoints.includes(jointName)) {
              actualDegrees = -degrees;
            }

            const radians = actualDegrees * (Math.PI / 180);

            // xyz_axis is an array like [0, 1, 0]
            // We multiply the radians with the axis to apply rotation to the correct axis
            joint.rotate[0] = joint.xyz_axis[0] * radians;
            joint.rotate[1] = joint.xyz_axis[1] * radians;
            joint.rotate[2] = joint.xyz_axis[2] * radians;
          }
        }

        joints.forEach((joint) => {
          const sliderEl = document.getElementById(`${joint.name}-slider`);
          const valueLabel = document.getElementById(`${joint.name}-value`);

          if (sliderEl) {
            if (joint.name === 'rotate') {
                sliderEl.addEventListener("input", function () { // Update label in real-time
                    valueLabel.textContent = this.value;
                });
                sliderEl.addEventListener("change", function () { // Trigger function on change
                    const name = document.getElementById("select1").value;
                    input_rotate2(name, parseFloat(this.value));
                });
            } else { // All other range sliders
                sliderEl.addEventListener("input", function () {
                  const value = this.value;
                  valueLabel.textContent = value;
                  update_joint_angle(joint.name, parseFloat(value));
                });
            }
          }
        });
      });

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兩欄式佈局</title>
    <!-- 引用專案既有的 Bootstrap CSS -->
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <style>
        /* 增加一些基本樣式以突顯區塊 */
        body {
            background-color: #f4f4f4;
        }
        .main-content {
            padding: 20px;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: .25rem;
            height: 100%;
        }
        .sidebar {
            padding: 20px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: .25rem;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 主要內容區塊 (比例 8/12) -->
            <div class="col-md-8 mb-3">
                <div class="main-content">
                    <h1>HI</h1>
                    <p>這是一個測試頁面。</p>
                    <p>這是主要內容區域。</p>
                </div>
            </div>
            <!-- 側邊欄區塊 (比例 4/12) -->
            <div class="col-md-4 mb-3">
                <div class="sidebar">
                    <h2>側邊欄</h2>
                    <p>這裡是次要內容或操作按鈕。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 為了讓 Bootstrap 組件能正常運作，通常需要引入 JS -->
    <!-- 您可以根據需要取消註解這些行 -->
    <!-- <script src="static/js/plugins/jQuery/jquery.min.js"></script> -->
    <!-- <script src="static/js/plugins/bootstrap/bootstrap.bundle.min.js"></script> -->
</body>
</html>
